<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Music Player</title>

  <meta
    name="title"
    content="Music Player"
  >

  <meta
    name="description"
    content="A Spotify-style web music player"
  >

  <link
    rel="shortcut icon"
    href="./favicon.svg"
    type="image/svg+xml"
  >

  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- MATERIAL SYMBOLS -->

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,-25"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="./assets/css/style.css"
  >

</head>


<body>

  <div class="app">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">


      <!-- LOGO -->

      <div class="sidebar-logo">

        <span class="material-symbols-rounded">
          graphic_eq
        </span>

        <span>
          Music Player
        </span>

      </div>


      <!-- ===================================================
           MAIN NAVIGATION
           =================================================== -->

      <nav class="main-nav">


        <!-- HOME -->

        <a
          href="#"
          class="nav-item active"
          data-nav="home"
        >

          <span class="material-symbols-rounded">
            home
          </span>

          <span>
            Home
          </span>

        </a>


        <!-- SEARCH -->

        <a
          href="#"
          class="nav-item"
          data-nav="search"
        >

          <span class="material-symbols-rounded">
            search
          </span>

          <span>
            Search
          </span>

        </a>


        <!-- ALL SONGS -->

        <a
          href="#"
          class="nav-item"
          data-nav="library"
        >

          <span class="material-symbols-rounded">
            library_music
          </span>

          <span>
            All Songs
          </span>

        </a>

      </nav>


      <!-- ===================================================
           LIBRARY
           =================================================== -->

      <div class="sidebar-section">

        <p class="sidebar-title">
          Library
        </p>


        <!-- ALL SONGS -->

        <button
          type="button"
          class="sidebar-link"
          data-sidebar-library="all"
        >

          All Songs

        </button>


        <!-- RECENT -->

        <button
          type="button"
          class="sidebar-link"
          data-sidebar-library="recent"
        >

          Recently Played

        </button>


        <!-- FAVORITES -->

        <button
          type="button"
          class="sidebar-link"
          data-sidebar-library="favorites"
        >

          Favorites

        </button>


        <!-- ARTISTS -->

        <button
          type="button"
          class="sidebar-link"
          data-sidebar-library="artists"
        >

          Artists

        </button>


        <!-- ALBUMS -->

        <button
          type="button"
          class="sidebar-link"
          data-sidebar-library="albums"
        >

          Albums

        </button>

      </div>

    </aside>


    <!-- =====================================================
         HOME
         ===================================================== -->

    <main class="home">


      <!-- HOME HEADER -->

      <header class="home-header">

        <button
          class="mobile-menu btn-icon"
          type="button"
          data-mobile-menu
          aria-label="Open menu"
        >

          <span class="material-symbols-rounded">
            menu
          </span>

        </button>


        <div>

          <p class="greeting">
            Welcome back
          </p>

          <h1>
            Good morning
          </h1>

        </div>

      </header>


      <!-- ===================================================
           QUICK PLAYLISTS
           =================================================== -->

      <section class="quick-playlists">

        <div
          class="quick-grid"
          data-quick-list
        ></div>

      </section>


      <!-- ===================================================
           RECENTLY PLAYED
           =================================================== -->

      <section class="music-section">

        <div class="section-header">

          <h2>
            Recently played
          </h2>

          <button
            type="button"
            class="show-all"
            data-show-recent
          >
            Show all
          </button>

        </div>


        <div
          class="music-grid"
          data-recently-played
        ></div>

      </section>


      <!-- ===================================================
           TOP MIXES
           =================================================== -->

      <section class="music-section">

        <div class="section-header">

          <h2>
            Your top mixes
          </h2>

          <button
            type="button"
            class="show-all"
            data-show-mixes
          >
            Show all
          </button>

        </div>


        <div
          class="music-grid"
          data-top-mixes
        ></div>

      </section>

    </main>


    <!-- =====================================================
         NOW PLAYING
         ===================================================== -->

    <aside class="now-playing">


      <div class="now-playing-header">

        <h2>
          Now playing
        </h2>


        <button
          class="btn-icon"
          type="button"
          aria-label="More options"
          data-now-playing-more
        >

          <span class="material-symbols-rounded">
            more_horiz
          </span>

        </button>

      </div>


      <!-- VINYL -->

      <figure class="now-playing-art">

        <img
          src="./assets/images/poster-1.jpg"
          class="now-playing-image"
          alt="Nang Dumating Ka"
          data-now-playing-image
        >

      </figure>


      <!-- INFO -->

      <div class="now-playing-info">

        <div>

          <h2 data-now-playing-title>
            Nang Dumating Ka
          </h2>

          <p data-now-playing-artist>
            Bandang Lapis
          </p>

        </div>


        <button
          class="btn-icon favorite-btn"
          type="button"
          data-favorite
          aria-label="Add to favorites"
        >

          <span class="material-symbols-rounded">
            favorite_border
          </span>

        </button>

      </div>

    </aside>


    <!-- =====================================================
         BOTTOM PLAYER
         ===================================================== -->

    <footer class="bottom-player">


      <!-- CURRENT SONG -->

      <div class="current-song">

        <img
          src="./assets/images/poster-1.jpg"
          alt="Nang Dumating Ka"
          data-player-banner
        >


        <div class="current-song-info">

          <strong data-title>
            Nang Dumating Ka
          </strong>

          <span data-artist>
            Bandang Lapis
          </span>

        </div>


        <button
          class="btn-icon favorite-btn"
          type="button"
          data-favorite
          aria-label="Add to favorites"
        >

          <span class="material-symbols-rounded">
            favorite_border
          </span>

        </button>

      </div>


      <!-- PLAYER -->

      <div class="player-controls">

        <div class="control-buttons">


          <!-- SHUFFLE -->

          <button
            class="btn-icon toggle"
            type="button"
            data-shuffle
            aria-label="Enable shuffle"
          >

            <span class="material-symbols-rounded">
              shuffle
            </span>

          </button>


          <!-- PREVIOUS -->

          <button
            class="btn-icon"
            type="button"
            data-skip-prev
            aria-label="Previous song"
          >

            <span class="material-symbols-rounded">
              skip_previous
            </span>

          </button>


          <!-- PLAY -->

          <button
            class="play-button"
            type="button"
            data-play-btn
            aria-label="Play"
          >

            <span class="material-symbols-rounded default-icon">
              play_arrow
            </span>

            <span class="material-symbols-rounded active-icon">
              pause
            </span>

          </button>


          <!-- NEXT -->

          <button
            class="btn-icon"
            type="button"
            data-skip-next
            aria-label="Next song"
          >

            <span class="material-symbols-rounded">
              skip_next
            </span>

          </button>


          <!-- REPEAT -->

          <button
            class="btn-icon toggle"
            type="button"
            data-repeat
            aria-label="Enable repeat"
          >

            <span class="material-symbols-rounded default-icon">
              repeat
            </span>

            <span class="material-symbols-rounded active-icon">
              repeat_one
            </span>

          </button>

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

          <span data-running-time>
            0:00
          </span>


          <div class="range-wrapper">

            <input
              type="range"
              class="range"
              min="0"
              max="0"
              step="1"
              value="0"
              data-range
              data-seek
              aria-label="Song progress"
            >


            <div
              class="range-fill"
              data-range-fill
            ></div>

          </div>


          <span data-duration>
            0:00
          </span>

        </div>

      </div>


      <!-- VOLUME -->

      <div class="player-volume">

        <button
          class="btn-icon"
          type="button"
          data-volume-btn
          aria-label="Mute"
        >

          <span class="material-symbols-rounded">
            volume_up
          </span>

        </button>


        <div class="range-wrapper">

          <input
            type="range"
            class="range"
            min="0"
            max="1"
            step="0.05"
            value="1"
            data-range
            data-volume
            aria-label="Volume"
          >


          <div
            class="range-fill"
            data-range-fill
          ></div>

        </div>

      </div>

    </footer>


    <!-- =====================================================
         LIBRARY PANEL
         ===================================================== -->

    <aside
      class="playlist"
      data-playlist
    >


      <div class="playlist-header">


        <div class="playlist-title-row">

          <h2 data-library-title>
            All Songs
          </h2>


          <button
            class="btn-icon"
            type="button"
            data-playlist-close
            aria-label="Close library"
          >

            <span class="material-symbols-rounded">
              close
            </span>

          </button>

        </div>


        <!-- SEARCH -->

        <div class="playlist-search">

          <span class="material-symbols-rounded">
            search
          </span>


          <input
            type="search"
            placeholder="Search songs, artists, or albums"
            autocomplete="off"
            data-music-search
            aria-label="Search music"
          >

        </div>


        <!-- LIBRARY TABS -->

        <div class="playlist-filter library-tabs">


          <button
            type="button"
            class="filter-btn active"
            data-library-tab="all"
          >
            All Songs
          </button>


          <button
            type="button"
            class="filter-btn"
            data-library-tab="recent"
          >
            Recently Played
          </button>


          <button
            type="button"
            class="filter-btn"
            data-library-tab="favorites"
          >
            Favorites
          </button>


          <button
            type="button"
            class="filter-btn"
            data-library-tab="artists"
          >
            Artists
          </button>


          <button
            type="button"
            class="filter-btn"
            data-library-tab="albums"
          >
            Albums
          </button>

        </div>


        <!-- SORT -->

        <div class="playlist-filter">


          <button
            type="button"
            class="filter-btn active"
            data-sort="default"
          >
            Default
          </button>


          <button
            type="button"
            class="filter-btn"
            data-sort="title-asc"
          >
            A–Z
          </button>


          <button
            type="button"
            class="filter-btn"
            data-sort="title-desc"
          >
            Z–A
          </button>


          <button
            type="button"
            class="filter-btn"
            data-sort="artist-asc"
          >
            Artist A–Z
          </button>


          <button
            type="button"
            class="filter-btn"
            data-sort="artist-desc"
          >
            Artist Z–A
          </button>


          <button
            type="button"
            class="filter-btn"
            data-sort="album-asc"
          >
            Album A–Z
          </button>

        </div>

      </div>


      <!-- SONG LIST -->

      <ul
        class="music-list"
        data-library-list
      ></ul>

    </aside>


    <!-- =====================================================
         OVERLAY
         ===================================================== -->

    <div
      class="overlay"
      data-overlay
    ></div>


  </div>


  <!-- JAVASCRIPT -->

  <script src="./assets/js/script.js"></script>

</body>

</html>
